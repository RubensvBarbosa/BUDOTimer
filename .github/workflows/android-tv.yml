name: App para TV Android

# Gera o BudoTimer.apk sempre que o timer ou o projeto Android mudam,
# e publica na página de Releases (tag "tv").
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'build_android.py'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar a página do app
        run: python3 build_android.py

      - name: Compilar o app
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk BudoTimer.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv
          name: BUDO Timer para TV Android
          body: |
            App do BUDO Timer para TVs Android e Google TV (TCL, Sony, Philips, Xiaomi e outras).
            Versão gerada automaticamente a partir do commit ${{ github.sha }}.
            Instalação: veja o README do repositório.
          files: BudoTimer.apk
          make_latest: true
